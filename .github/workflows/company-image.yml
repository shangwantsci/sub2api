name: Company Image

# Builds the company-deployment branch into a docker image tarball and uploads
# it as a workflow artifact. Deliberately never pushes to GHCR: the shared
# mutable tag ghcr.io/<owner>/sub2api:<VERSION> is owned by the custom/prod
# production deployment, and pushing this branch under the same VERSION would
# overwrite the image production pulls.
#
# Transfer path: gh run download -> scp -> docker load on the company server.
# The company server therefore never needs registry credentials.

# Manual only. This file is deliberately kept off the default branch so it can
# never interfere with release.yml's calibration schedule; the temporary `push`
# trigger that was needed to register it with GitHub was removed after the
# 2026-07-25 bootstrap run. Trigger it with:
#
#   gh workflow run company-image.yml --ref custom/company
#
# If the run history for this workflow is ever deleted it becomes unregistered
# again, and you have to re-add a temporary `push:` trigger to bootstrap it.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/commit to build'
        required: false
        type: string
        default: 'custom/company'
      retention_days:
        description: 'Artifact retention in days'
        required: false
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  company-image:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RETENTION_DAYS: ${{ inputs.retention_days }}
    steps:
      # Keeps the two deployment lines from crossing. Building custom/prod here
      # would produce production code under a sub2api-company:* tag, which is
      # the kind of mix-up that is only noticed after it is deployed.
      - name: Refuse to build a production ref
        run: |
          case "$SOURCE_REF" in
            main|custom/prod|refs/heads/main|refs/heads/custom/prod)
              echo "::error::$SOURCE_REF belongs to the production line." \
                   "Build it with release.yml (custom_image_only), not this workflow."
              exit 1
              ;;
          esac
          echo "source ref $SOURCE_REF accepted"

      - name: Checkout requested source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Resolve official version and source commit
        id: metadata
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid backend/cmd/server/VERSION: $VERSION" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse --short=8 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "image=sub2api-company:$VERSION-$COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact=sub2api-company-$VERSION-$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image into the local docker daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.metadata.outputs.image }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
          cache-from: type=gha,scope=sub2api-company-amd64
          cache-to: type=gha,mode=max,scope=sub2api-company-amd64
          provenance: false

      - name: Verify the built binary reports the expected version
        run: |
          docker run --rm --entrypoint /app/sub2api \
            "${{ steps.metadata.outputs.image }}" --version

      - name: Export image tarball
        run: |
          mkdir -p /tmp/image
          docker save "${{ steps.metadata.outputs.image }}" \
            | gzip -9 > "/tmp/image/${{ steps.metadata.outputs.artifact }}.tar.gz"
          ls -lh /tmp/image

      - name: Record the image digest for transfer verification
        id: checksum
        run: |
          cd /tmp/image
          sha256sum "${{ steps.metadata.outputs.artifact }}.tar.gz" \
            > "${{ steps.metadata.outputs.artifact }}.tar.gz.sha256"
          cat "${{ steps.metadata.outputs.artifact }}.tar.gz.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: /tmp/image/
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0

      - name: Publish transfer instructions
        run: |
          {
            echo "## Company image"
            echo ""
            echo "- Source: \`${{ env.SOURCE_REF }}\`"
            echo "- Commit: \`${{ steps.metadata.outputs.commit }}\`"
            echo "- App version: \`${{ steps.metadata.outputs.version }}\`"
            echo "- Local image tag: \`${{ steps.metadata.outputs.image }}\`"
            echo "- Not pushed to GHCR by design."
            echo ""
            echo '```bash'
            echo "gh run download ${{ github.run_id }} --repo ${{ github.repository }} \\"
            echo "  --name ${{ steps.metadata.outputs.artifact }} --dir ./transfer"
            echo "cd transfer && shasum -a 256 -c ${{ steps.metadata.outputs.artifact }}.tar.gz.sha256"
            echo "scp -P <PORT> ${{ steps.metadata.outputs.artifact }}.tar.gz <USER>@<HOST>:/tmp/"
            echo "ssh -p <PORT> <USER>@<HOST> 'docker load -i /tmp/${{ steps.metadata.outputs.artifact }}.tar.gz'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
