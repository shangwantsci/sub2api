name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Run real-CLI calibration off the production server every 6 hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      custom_image_only:
        description: 'Build GHCR image from source_ref without creating/requiring a Git tag'
        required: false
        type: boolean
        default: false
      source_ref:
        description: 'Branch/commit to build when custom_image_only=true'
        required: false
        type: string
        default: 'custom/prod'
      customer_id:
        description: 'Customer image watermark/tag (community keeps existing production tags)'
        required: false
        type: string
        default: 'community'
      calibrate_only:
        description: 'Run real Claude Code calibration and publish profile; do not build a release'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: write
  packages: write

jobs:
  claude-calibration:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.calibrate_only == 'true') }}
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ secrets.CC_CALIBRATE_GATEWAY_URL }}
      ADMIN_API_KEY: ${{ secrets.CC_CALIBRATE_ADMIN_API_KEY }}
      # Customer deployments pull the profile from the license server on their
      # hourly renewal, so they never expose an inbound admin API.
      LICENSE_SERVER_URL: ${{ secrets.DEPLOYMENT_LICENSE_SERVER_URL }}
      LICENSE_ADMIN_TOKEN: ${{ secrets.DEPLOYMENT_LICENSE_ADMIN_TOKEN }}
    steps:
      - name: Checkout calibration source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'custom/prod' || github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run real Claude Code calibration
        env:
          CC_VERSION: latest
          CC_CALIBRATE_MODELS: haiku sonnet opus fable
          CC_CALIBRATE_KEEP_CAP: '1'
          CAL_DIR: ${{ github.workspace }}/tools/cc-calibrate
          OUT_DIR: ${{ runner.temp }}/cc-calibrate-out
        run: |
          mkdir -p "$OUT_DIR"
          bash tools/cc-calibrate/calibrate-run.sh
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const p = JSON.parse(fs.readFileSync(path, "utf8"));
            if (!p.guard?.salt_verified || p.guard.ok !== p.guard.checked || p.guard.checked < 1) {
              throw new Error(`fingerprint guard failed: ${JSON.stringify(p.guard)}`);
            }
            console.log(`guard passed ${p.guard.ok}/${p.guard.checked}, CLI ${p.cli_version}`);
          ' "$(ls "$OUT_DIR"/profile-*.json | head -1)"

      - name: Upload calibration evidence
        uses: actions/upload-artifact@v7
        with:
          name: claude-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/cc-calibrate-out/
          retention-days: 14

      - name: Publish calibrated profile to gateway
        if: ${{ env.GATEWAY_URL != '' && env.ADMIN_API_KEY != '' }}
        run: |
          PROFILE="$(ls "${{ runner.temp }}"/cc-calibrate-out/profile-*.json | head -1)"
          node tools/cc-calibrate/publish.js "$PROFILE" "$GATEWAY_URL" "$ADMIN_API_KEY"

      # One push here reaches every customer instance; each picks the profile up
      # on its next renewal. Failing this must not fail the calibration run.
      - name: Publish calibrated profile to license server
        if: ${{ env.LICENSE_SERVER_URL != '' && env.LICENSE_ADMIN_TOKEN != '' }}
        continue-on-error: true
        run: |
          PROFILE="$(ls "${{ runner.temp }}"/cc-calibrate-out/profile-*.json | head -1)"
          STATUS="$(curl -sS -o /tmp/license-publish.out -w '%{http_code}' \
            -X POST "${LICENSE_SERVER_URL%/}/admin/calibration-profile" \
            -H "Authorization: Bearer $LICENSE_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$PROFILE")"
          echo "license server responded HTTP $STATUS"
          cat /tmp/license-publish.out
          test "$STATUS" = "200"

      - name: Calibration summary
        if: always()
        run: |
          {
            echo "## Claude Code calibration"
            echo ""
            echo "- Runs on GitHub-hosted Linux x64; production CPU/RAM is untouched."
            echo "- Raw capture + profile retained as a 14-day artifact."
            echo "- Publish requires repository secrets CC_CALIBRATE_GATEWAY_URL and CC_CALIBRATE_ADMIN_API_KEY."
            echo "- Customer fan-out requires DEPLOYMENT_LICENSE_SERVER_URL and DEPLOYMENT_LICENSE_ADMIN_TOKEN."
          } >> "$GITHUB_STEP_SUMMARY"

  # Fork production path: build remotely on GitHub Actions without creating a new
  # Git tag. The application VERSION remains backend/cmd/server/VERSION (official
  # semver), while a second immutable image tag includes the source commit.
  custom-image:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.custom_image_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Resolve official version and source commit
        id: metadata
        shell: bash
        env:
          LICENSE_PUBLIC_KEY: ${{ vars.DEPLOYMENT_LICENSE_PUBLIC_KEY }}
        run: |
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid backend/cmd/server/VERSION: $VERSION" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse --short=8 HEAD)"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          CUSTOMER_ID="$(echo '${{ github.event.inputs.customer_id }}' | tr '[:upper:]' '[:lower:]')"
          CUSTOMER_ID="${CUSTOMER_ID:-community}"
          if ! [[ "$CUSTOMER_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "Invalid customer_id: $CUSTOMER_ID" >&2
            exit 1
          fi
          if [ "$CUSTOMER_ID" = community ]; then
            IMAGE="ghcr.io/$OWNER/sub2api"
          else
            if [ -z "$LICENSE_PUBLIC_KEY" ]; then
              echo "Repository variable DEPLOYMENT_LICENSE_PUBLIC_KEY is required for customer images" >&2
              exit 1
            fi
            IMAGE="ghcr.io/$OWNER/sub2api-customer-$CUSTOMER_ID"
          fi
          MUTABLE_TAG="$IMAGE:$VERSION"
          IMMUTABLE_TAG="$IMAGE:$VERSION-$COMMIT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "customer_id=$CUSTOMER_ID" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "mutable_tag=$MUTABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building $OWNER/sub2api version=$VERSION commit=$COMMIT customer=$CUSTOMER_ID"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.mutable_tag }}
            ${{ steps.metadata.outputs.immutable_tag }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            CUSTOMER_ID=${{ steps.metadata.outputs.customer_id }}
            LICENSE_PUBLIC_KEY=${{ vars.DEPLOYMENT_LICENSE_PUBLIC_KEY }}
          cache-from: type=gha,scope=sub2api-custom-amd64
          cache-to: type=gha,mode=max,scope=sub2api-custom-amd64
          provenance: false

      - name: Publish build summary
        run: |
          {
            echo "## Custom GHCR image"
            echo ""
            echo "- Source: \`${{ github.event.inputs.source_ref }}\`"
            echo "- Commit: \`${{ steps.metadata.outputs.commit }}\`"
            echo "- Customer: \`${{ steps.metadata.outputs.customer_id }}\`"
            echo "- Official app version: \`${{ steps.metadata.outputs.version }}\`"
            echo "- Deploy tag: \`${{ steps.metadata.outputs.mutable_tag }}\`"
            echo "- Immutable rollback tag: \`${{ steps.metadata.outputs.immutable_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Update VERSION file with tag version
  update-version:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.custom_image_only != 'true' && github.event.inputs.calibrate_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update VERSION file
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.tag }}
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.custom_image_only != 'true' && github.event.inputs.calibrate_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.custom_image_only != 'true' && github.event.inputs.calibrate_only != 'true') }}
    needs: [update-version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME=${{ github.event.inputs.tag }}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME=${{ github.event.inputs.tag }}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE='${{ steps.tag_message.outputs.message }}'
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [release]
    if: ${{ needs.release.result == 'success' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.custom_image_only == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.tag }}
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
