# =============================================================================
# sub2api 管理后台 —— 仅 HTTPS，仅后台，网关不对外
# =============================================================================
# 这个文件不是宝塔面板创建的站点，宝塔后台里看不到它，但 nginx.conf 的
# `include /www/server/panel/vhost/nginx/*.conf` 会加载它。
#
# 复用 www.51tokens.vip 的现有 Let's Encrypt 证书（SAN 只有这一个域名，
# 不是通配符），因此监听同域名的另一个端口，无需新增 DNS 记录。
#
#   https://www.51tokens.vip:8443  ->  127.0.0.1:18080 (sub2api 容器)
#
# 443 端口仍然只属于 NewAPI，本文件不碰它。
# 注意：证书 2026-10-21 到期，续期后本文件无需改动（路径不变）。
# =============================================================================

server
{
    listen 8443 ssl;
    http2 on;
    server_name www.51tokens.vip;

    # 与 NewAPI 站点共用同一张证书
    ssl_certificate        /www/server/panel/vhost/cert/www.51tokens.vip/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.51tokens.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_SUB2API:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 明文 HTTP 打到这个端口时给出可读提示，而不是一堆二进制
    error_page 497 https://$host:8443$request_uri;

    # 账号导入/数据导入可能是大 body
    client_max_body_size 100m;

    # -------------------------------------------------------------------------
    # 网关推理入口：不对公网开放
    # -------------------------------------------------------------------------
    # NewAPI 走 127.0.0.1:18080 直连，不经过 nginx，所以这里全部挡掉不影响它。
    # 返回 404 而不是 403，避免对外确认这些路径的存在。
    # 前端 dist 只有 assets/、index.html、logo.png，与下列前缀无任何重叠。
    location ^~ /v1/            { return 404; }
    location ^~ /responses      { return 404; }
    location ^~ /images/        { return 404; }
    location ^~ /videos/        { return 404; }
    location ^~ /backend-api/   { return 404; }
    location = /chat/completions { return 404; }
    location = /embeddings      { return 404; }
    location = /models          { return 404; }
    location = /alpha/search    { return 404; }

    # -------------------------------------------------------------------------
    # 管理后台本体
    # -------------------------------------------------------------------------
    # 注意 /api/v1/ 与上面被挡的 /v1/ 是不同前缀，后台 API 不受影响。
    location /
    {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 让应用知道外层是 HTTPS，否则可能签发非 Secure 的 cookie 或生成 http:// 跳转
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8443;

        # 后台有 WebSocket 面板
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/sub2api-admin.log;
    error_log  /www/wwwlogs/sub2api-admin.error.log;
}
