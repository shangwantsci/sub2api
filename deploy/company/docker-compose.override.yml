# =============================================================================
# Company deployment override
# =============================================================================
# Layered on top of deploy/docker-compose.local.yml:
#
#   docker compose -f docker-compose.local.yml -f docker-compose.override.yml up -d
#
# Topology (verified on the target host 2026-07-25): NewAPI is NOT containerised
# on this machine -- it runs as the native systemd unit newapi-51tokens.service
# listening on :3000, behind the host's nginx. So there is no docker network to
# join. NewAPI reaches the pool as a plain host process over loopback:
#
#   new-api (host) ──► http://127.0.0.1:18080 ──► sub2api (container)
#
# That loopback publish is the whole integration. It is also how you reach the
# admin UI, via an SSH tunnel:
#
#   ssh -N -L 18080:127.0.0.1:18080 root@<HOST>   # then http://localhost:18080
#
# Nothing is published on a routable address, so there is no domain, no reverse
# proxy for the pool, and no ufw rule to open. The bind address and port come
# from BIND_HOST / SERVER_PORT in .env, which the base file already
# parameterises -- do not redefine `ports` here, Compose appends to the base
# list rather than replacing it and you would end up publishing 0.0.0.0:8080
# as well.
#
# postgres and redis stay on the base file's internal sub2api-network and
# publish nothing, so they cannot collide with the host's existing MariaDB.
# =============================================================================

services:
  sub2api:
    # The image is transferred as a tarball and installed with `docker load`,
    # so it lives only in this host's docker daemon under a local tag such as
    # sub2api-company:0.1.156-<commit>. That tag is in no registry, so never
    # run `docker compose pull sub2api`; pull_policy makes an accidental `up`
    # fail fast instead of trying to fetch it.
    image: "${SUB2API_IMAGE:?set SUB2API_IMAGE in .env to the loaded tag}"
    pull_policy: never
